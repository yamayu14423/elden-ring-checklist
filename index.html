<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>
      ELDEN RING 完全攻略チェックリスト | Complete Walkthrough Checklist
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>ELDEN RING 完全攻略チェックリスト</h1>
    <p class="note">
      全エリアをタブで切り替えて、アイテムやイベントなどの回収状況を管理できます。
      チェック状態はエリアごとに自動保存されます。
      進捗のバックアップには「進捗を書き出す」を、保存した進捗の復元には「進捗を読み込む」を使ってください。
    </p>
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="攻略エリア">
        <button
          class="tab"
          id="tab-limgrave"
          role="tab"
          aria-selected="true"
          data-area="limgrave"
        >
          リムグレイブ編</button
        ><button
          class="tab"
          id="tab-liurnia"
          role="tab"
          aria-selected="false"
          data-area="liurnia"
        >
          湖のリエーニエ編</button
        ><button
          class="tab"
          id="tab-caelid"
          role="tab"
          aria-selected="false"
          data-area="caelid"
        >
          ケイリッド編</button
        ><button
          class="tab"
          id="tab-altus"
          role="tab"
          aria-selected="false"
          data-area="altus"
        >
          アルター高原編</button
        ><button
          class="tab"
          id="tab-underground"
          role="tab"
          aria-selected="false"
          data-area="underground"
        >
          地下世界編</button
        ><button
          class="tab"
          id="tab-leyndell"
          role="tab"
          aria-selected="false"
          data-area="leyndell"
        >
          王都ローデイル編</button
        ><button
          class="tab"
          id="tab-mountaintops"
          role="tab"
          aria-selected="false"
          data-area="mountaintops"
        >
          巨人たちの山嶺編</button
        ><button
          class="tab"
          id="tab-volcano"
          role="tab"
          aria-selected="false"
          data-area="volcano"
        >
          火山館編</button
        ><button
          class="tab"
          id="tab-ash"
          role="tab"
          aria-selected="false"
          data-area="ash"
        >
          灰都ローデイル編</button
        ><button
          class="tab"
          id="tab-graveyard"
          role="tab"
          aria-selected="false"
          data-area="graveyard"
        >
          墓地平原編（DLC）</button
        ><button
          class="tab"
          id="tab-bluecoast"
          role="tab"
          aria-selected="false"
          data-area="bluecoast"
        >
          青海岸編（DLC）</button
        ><button
          class="tab"
          id="tab-gizayama"
          role="tab"
          aria-selected="false"
          data-area="gizayama"
        >
          ギザ山編（DLC）</button
        ><button
          class="tab"
          id="tab-shadowalt"
          role="tab"
          aria-selected="false"
          data-area="shadowalt"
        >
          影のアルター編（DLC）</button
        ><button
          class="tab"
          id="tab-shadowcastle"
          role="tab"
          aria-selected="false"
          data-area="shadowcastle"
        >
          影の城編（DLC）</button
        ><button
          class="tab"
          id="tab-abyss"
          role="tab"
          aria-selected="false"
          data-area="abyss"
        >
          奈落編（DLC）</button
        ><button
          class="tab"
          id="tab-rauh"
          role="tab"
          aria-selected="false"
          data-area="rauh"
        >
          ラウフの古遺跡編（DLC）</button
        ><button
          class="tab"
          id="tab-enirilim"
          role="tab"
          aria-selected="false"
          data-area="enirilim"
        >
          エニル・イリム編（DLC）
        </button>
      </div>
      <div class="map-row">
        <button type="button" id="mapButton" class="map-button">
          🧭 マップを見る</button
        ><span id="mapHint" class="note"
          >選択中のエリアのマップを表示します。</span
        >
      </div>
      <div class="count" id="progressText">読み込み中…</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="controls">
        <input
          id="search"
          type="search"
          placeholder="項目・TIPを検索…"
        /><select id="filter">
          <option value="all">すべて表示</option>
          <option value="todo">未完了のみ</option>
          <option value="done">完了のみ</option>
        </select>
      </div>
      <div class="controls">
        <button id="export">進捗を書き出す</button
        ><button id="import">進捗を読み込む</button
        ><input
          id="fileInput"
          type="file"
          accept="application/json,.json"
        /><button id="reset">このタブのチェックを外す</button>
      </div>
    </div>
    <main id="list" aria-live="polite"></main>
    <div
      id="mapModal"
      class="map-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="mapTitle"
      aria-hidden="true"
    >
      <div class="map-dialog">
        <div class="map-head">
          <h2 id="mapTitle">エリアマップ</h2>
          <button
            type="button"
            id="mapClose"
            class="map-close"
            aria-label="マップを閉じる"
          >
            ✕ 閉じる
          </button>
        </div>
        <div id="mapViewport" class="map-image-wrap">
          <img
            id="mapImage"
            class="map-image"
            alt="選択中エリアのマップ"
            hidden
          />
          <div id="mapMessage" class="map-message"></div>
          <button type="button" id="mapFit" class="map-fit" hidden>
            全体表示
          </button>
        </div>
        <div id="mapNav" class="map-nav" hidden>
          <button type="button" id="mapPrev">← 前へ</button
          ><span id="mapCounter" class="map-counter">1 / 1</span
          ><button type="button" id="mapNext">次へ →</button>
          <div
            id="mapPageButtons"
            class="map-page-buttons"
            aria-label="マップページ"
          ></div>
        </div>
      </div>
    </div>
    <button
      id="mapFloatingButton"
      aria-label="マップを見る"
      title="マップを見る"
    >
      🧭
    </button>
    <button id="toTop" aria-label="ページ上部へ戻る">↑</button>
    <script src="script.js" defer></script>
  </body>
</html>
